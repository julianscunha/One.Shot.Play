<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração Inicial - YouTube Automation</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🎬 Configuração Inicial</h1>
      <p class="subtitle">Configure seu sistema de automação de YouTube</p>

      <form id="setupForm">
        <div class="form-group">
          <label for="channelName">Nome do Canal</label>
          <input type="text" id="channelName" name="channelName" required>
        </div>

        <div class="form-group">
          <label for="author">Autor</label>
          <input type="text" id="author" name="author" required>
        </div>

        <div class="form-group">
          <label for="openRouterKey">OpenRouter API Key</label>
          <input type="password" id="openRouterKey" name="openRouterKey" required>
        </div>

        <div class="form-group">
          <label for="telegramToken">Telegram Bot Token</label>
          <input type="password" id="telegramToken" name="telegramToken" required>
        </div>

        <button type="submit" class="btn-primary">Salvar e Continuar</button>
      </form>

      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);

      const status = document.getElementById('status');
      status.innerHTML = '<div class="loading">Salvando...</div>';

      try {
        const response = await fetch('/setup/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
          status.innerHTML = '<div class="success">Configuração salva! Redirecionando...</div>';
          setTimeout(() => window.location.href = '/', 1500);
        } else {
          status.innerHTML = `<div class="error">${result.error || 'Erro ao salvar'}</div>`;
        }
      } catch (error) {
        status.innerHTML = '<div class="error">Erro de conexão</div>';
      }
    });
  </script>
</body>
</html>
